name: Build & Release Rust Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: cpl-linux-amd64
            asset_name: cpl-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: cpl.exe
            asset_name: cpl-windows-amd64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: cpl
            asset_name: cpl-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build binary (Release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary asset
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/cpl.exe" "${{ matrix.asset_name }}"
          else
            cp "target/${{ matrix.target }}/release/cpl" "${{ matrix.asset_name }}"
            chmod +x "${{ matrix.asset_name }}"
          fi

      - name: Upload artifact for Release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display downloaded artifacts
        run: ls -R ./artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/cpl-linux-amd64/cpl-linux-amd64
            ./artifacts/cpl-windows-amd64.exe/cpl-windows-amd64.exe
            ./artifacts/cpl-macos-arm64/cpl-macos-arm64
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
