[package]
name = "cpl"
version = "0.2.2"
edition = "2021"
authors = ["Copilot CLI Plus Developer"]
description = "Copilot CLI Plus (cpl): AI Solution Recall, Indexing & Self-Updating CLI Assistant"
repository = "https://github.com/BingFengHung/cpl"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled-full"] }
ratatui = "0.26"
crossterm = "0.27"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
arboard = "3.4"
ureq = { version = "2.9", features = ["json"] }
semver = "1.0"

[[bin]]
name = "cpl"
path = "src/main.rs"
